<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>David Pérez Pantoja · Trombón bajo</title>
    <!-- Texto que muestra Google debajo del título (máx. ~160 caracteres) -->
    <meta
      name="description"
      content="Sitio oficial de David Pérez Pantoja, trombonista bajo de la Orquesta Sinfónica Nacional de Colombia y artista S.E. Shires. Presentaciones, eventos y contacto."
    />
    <!-- La dirección "oficial" (sin www) para que Google no la cuente doble -->
    <link rel="canonical" href="https://davidperezpantoja.com/" />
    <!-- Color de la barra del navegador en el celular -->
    <meta name="theme-color" content="#000000" />

    <!-- Íconos: pestaña del navegador y pantalla de inicio del iPhone -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, LinkedIn…).
         La imagen debe ir con la dirección completa (https://…) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="David Pérez Pantoja" />
    <meta property="og:title" content="David Pérez Pantoja · Trombón bajo" />
    <meta
      property="og:description"
      content="Trombonista bajo de la Orquesta Sinfónica Nacional de Colombia y artista S.E. Shires. Presentaciones, eventos y contacto."
    />
    <meta property="og:url" content="https://davidperezpantoja.com/" />
    <meta property="og:image" content="https://davidperezpantoja.com/og-imagen.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="David Pérez Pantoja con su trombón bajo" />
    <!-- Lo mismo para X (Twitter): tarjeta con imagen grande -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Datos para Google: quién es David (puede ayudar a que aparezca
         su ficha con foto y redes en los resultados de búsqueda) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "David Pérez Pantoja",
        "alternateName": "Stiven David Pérez Pantoja",
        "jobTitle": "Trombonista bajo",
        "url": "https://davidperezpantoja.com/",
        "image": "https://davidperezpantoja.com/og-imagen.jpg",
        "birthPlace": { "@type": "Place", "name": "Puerres, Nariño, Colombia" },
        "worksFor": { "@type": "Organization", "name": "Orquesta Sinfónica Nacional de Colombia" },
        "sameAs": [
          "https://www.instagram.com/_tromboncitobass_/",
          "https://www.facebook.com/tromboncito99",
          "https://www.youtube.com/channel/UC57gDsSHGgjFRIPMzDqbqEQ"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
